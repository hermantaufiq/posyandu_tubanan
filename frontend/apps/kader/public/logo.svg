<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="96" fill="white" stroke="#6B3FA0" stroke-width="3"/>
  
  <!-- Blue figure (left) -->
  <circle cx="52" cy="52" r="10" fill="#4A80E8"/>
  <!-- Blue U-shape body -->
  <path d="M38 72 Q38 100 52 100 Q66 100 66 72" fill="none" stroke="#4A80E8" stroke-width="12" stroke-linecap="round"/>

  <!-- Orange figure (top center) -->
  <circle cx="100" cy="45" r="10" fill="#F5853F"/>
  <!-- Orange V-shape body -->
  <path d="M82 65 L100 88 L118 65" fill="none" stroke="#F5853F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pink figure (right) -->
  <circle cx="148" cy="52" r="10" fill="#EE4CA1"/>
  <!-- Pink U-shape body (mirrored) -->
  <path d="M162 72 Q162 100 148 100 Q134 100 134 72" fill="none" stroke="#EE4CA1" stroke-width="12" stroke-linecap="round"/>

  <!-- Green figure (bottom center) -->
  <circle cx="100" cy="112" r="10" fill="#5CC85A"/>
  <!-- Green V-shape body (smaller) -->
  <path d="M84 130 L100 150 L116 130" fill="none" stroke="#5CC85A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
